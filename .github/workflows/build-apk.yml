
name: Build NFT BATTLE APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Extract Android project
        run: |
          mkdir -p source
          archive=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          test -n "$archive" || { echo "ZIP not found"; exit 1; }
          unzip -oq "$archive" -d source
          project_dir=$(find source -name settings.gradle -type f -printf '%h\n' | head -n 1)
          test -n "$project_dir" || { echo "settings.gradle not found"; exit 1; }
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Build APK
        run: /tmp/gradle-8.9/bin/gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
