name: Build NFT BATTLE APK

on:
  workflow_dispatch:
  push:
    paths:
      - "NFT_BATTLE_Firebase_Connected_V26.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

      - name: Extract the intended Android project
        shell: bash
        run: |
          set -euo pipefail
          archive="NFT_BATTLE_Firebase_Connected_V26.zip"
          if [[ ! -f "$archive" ]]; then
            echo "ERROR: $archive was not found in the repository root."
            echo "Files in repository root:"
            ls -la
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/nft-battle-source"
          unzip -oq "$archive" -d "$RUNNER_TEMP/nft-battle-source"
          project_dir="$(find "$RUNNER_TEMP/nft-battle-source" -type f -name settings.gradle -print -quit | xargs -r dirname)"
          if [[ -z "$project_dir" || ! -f "$project_dir/app/build.gradle" ]]; then
            echo "ERROR: Android project not found inside $archive (settings.gradle and app/build.gradle are required)."
            find "$RUNNER_TEMP/nft-battle-source" -maxdepth 5 -type f -print
            exit 1
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Project selected: $project_dir"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Verify APK was created
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$apk_path" ]]; then
            echo "ERROR: APK was not created at $apk_path"
            find "$PROJECT_DIR" -path '*/build/outputs/apk/*' -type f -print || true
            exit 1
          fi
          echo "APK created successfully: $apk_path"
          ls -lh "$apk_path"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFT-BATTLE-APK
          path: ${{ runner.temp }}/nft-battle-source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
